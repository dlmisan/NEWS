name: Daily Podcast Pipeline

on:
  schedule:
    # 每天北京时间早 04:45 (UTC 20:45)
    - cron: '45 20 * * *'
    # 每天北京时间晚 17:15 (UTC 09:15)
    - cron: '15 9 * * *'
  # 支持随时手动点击运行
  workflow_dispatch:

# 独立的并发控制，防止冲突
concurrency:
  group: podcast-daily-pipeline
  cancel-in-progress: false 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate News Audio & Podcast XML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python generate_podcast.py

      - name: Create GitHub Release and Upload Audio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=$(cat current_tag.txt)
          AUDIO_FILE=$(cat current_audio_filename.txt)
          
          gh release create "$TAG_NAME" "$AUDIO_FILE" \
            --title "国际要闻播报 ($TAG_NAME)" \
            --notes "由 GitHub Actions 自动化生成"

      - name: Deploy RSS to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      - name: Save News Deduplication History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history_ids.txt public/feed.xml || true
          git commit -m "Update news deduplication history and feed" || echo "No changes to commit"
          git checkout -- . || true
          git clean -fd || true
          git pull --rebase origin main
          git push origin main
