name: Entertainment Podcast Pipeline

on:
  schedule:
    # 每天北京时间早 03:15 (UTC 前一天 19:15) 定时运行
    - cron: '15 19 * * *'
  # 支持随时手动点击运行
  workflow_dispatch:

# 并发控制：防止多个任务同时运行产生 Git 冲突
concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate Entertainment Audio & Podcast XML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python generate_entertainment.py

      - name: Create GitHub Release and Upload Audio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=$(cat ent_current_tag.txt)
          AUDIO_FILE=$(cat ent_current_audio_filename.txt)
          
          gh release create "$TAG_NAME" "$AUDIO_FILE" \
            --title "娱乐体育奇闻播报 ($TAG_NAME)" \
            --notes "由 GitHub Actions 自动化生成"

      - name: Deploy RSS to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      - name: Save Entertainment Deduplication History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ent_history_ids.txt public/feed.xml 
          git commit -m "Update entertainment deduplication history and feed" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
