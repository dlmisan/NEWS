name: Entertainment Podcast Pipeline

on:
schedule:
# 每天北京时间早 03:15 (UTC 前一天 19:15) - 错开整点
- cron: '15 19 * * *'

支持随时手动点击运行

workflow_dispatch:

【保险1】并发控制：确保同一时间只有一个流在运行，防止 Git 提交冲突

concurrency:
group: podcast-pipeline
cancel-in-progress: false

permissions:
contents: write
pages: write
id-token: write

jobs:
run-pipeline:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0 # 确保拉取完整历史，避免 push 报错

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Dependencies
    run: |
      pip install -r requirements.txt

  - name: Generate Entertainment Audio & Podcast XML
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    run: |
      # 注意：这里调用的是新的 Python 脚本
      python generate_entertainment.py

  - name: Create GitHub Release and Upload Audio
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      # 注意：这里读取的也是新的、带 ent_ 前缀的文件名
      TAG_NAME=$(cat ent_current_tag.txt)
      AUDIO_FILE=$(cat ent_current_audio_filename.txt)
      
      gh release create "$TAG_NAME" "$AUDIO_FILE" \
        --title "娱乐体育奇闻播报 ($TAG_NAME)" \
        --notes "由 GitHub Actions 自动化生成"

  - name: Deploy RSS to GitHub Pages
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./public
      keep_files: true

  - name: Save Entertainment Deduplication History
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      # 注意：这里提交的是娱乐新闻的查重记录文件
      git add ent_history_ids.txt public/feed.xml
      git commit -m "Update entertainment deduplication history" || echo "No history changes to commit"
      # 【保险2】提交前先拉取远程最新代码，防止运行期间远程仓库有变动导致 push 失败
      git pull --rebase origin main
      git push origin main
